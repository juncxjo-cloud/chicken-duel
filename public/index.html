<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>닭 잡아라! 2인 대결</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#243322;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:12px}h2{font-size:22px}.panel{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #9aa99b}button{background:#25774b;color:white;font-weight:700;touch-action:none}input{width:105px;text-transform:uppercase}#board{position:relative;height:min(60vh,450px);min-height:300px;background:repeating-linear-gradient(45deg,#9ac879 0 38px,#a7d489 38px 76px);border:5px solid #678e54;border-radius:14px;overflow:hidden;touch-action:none}.person{position:absolute;font-size:54px;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(1px 3px 2px #0004)}#hint{font-weight:700;min-height:44px;margin:8px 0}#controls{display:flex;align-items:center;justify-content:space-between;gap:12px}#pad{width:146px;height:146px;border-radius:50%;background:#d8e6d4;position:relative;touch-action:none;border:3px solid #8cae87}#knob{width:62px;height:62px;border-radius:50%;background:#4e9a71;position:absolute;left:39px;top:39px}#action{width:105px;height:105px;border-radius:50%;background:#edaa3d;color:#332006;border:3px solid #d38e22}#action:disabled{opacity:.45}#next{display:none}small{color:#647568}</style></head><body><main><h2>🐔 닭 잡아라! · 2인 대결</h2><div class="panel"><button id="create">방 만들기</button><input id="code" maxlength="6" placeholder="방 코드"><button id="join">입장</button><button id="share">초대 공유</button></div><div id="hint">방을 만들고 친구에게 초대 링크를 보내세요.</div><div class="panel"><span id="info">대기 중</span><button id="next">🔄 역할 바꾸고 다음 판</button></div><div id="board"><div style="position:absolute;left:7%;top:7%;font-size:35px">🌳</div><div style="position:absolute;right:6%;top:10%;font-size:35px">🌻</div><div id="farmer" class="person" style="left:18%;top:55%">🏃</div><div id="chicken" class="person" style="left:80%;top:45%">🐔</div></div><div id="controls"><div id="pad"><div id="knob"></div></div><button id="action">🥅<br>포획!</button></div><small>왼쪽 원을 움직여 이동하세요. 닭 역할은 도망갑니다. 시간제한은 없습니다. 포획 성공 시 꼬꼬댁 소리가 납니다.</small></main><script>
const $=id=>document.getElementById(id);let ws,role='',room='',phase='waiting',dir={x:0,y:0},audio;
function unlock(){try{const A=window.AudioContext||window.webkitAudioContext;audio=audio||new A();audio.resume()}catch{}}
function sound(){try{unlock();let t=audio.currentTime;[650,510,740,490].forEach((f,i)=>{let o=audio.createOscillator(),v=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+i*.15);o.frequency.exponentialRampToValueAtTime(f*.7,t+i*.15+.12);v.gain.setValueAtTime(.0001,t+i*.15);v.gain.exponentialRampToValueAtTime(.12,t+i*.15+.02);v.gain.exponentialRampToValueAtTime(.0001,t+i*.15+.13);o.connect(v);v.connect(audio.destination);o.start(t+i*.15);o.stop(t+i*.15+.14)})}catch{}}
function message(s){$('hint').textContent=s}
function connect(code){unlock();if(ws)ws.close();ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'join',code}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){room=m.code;role=m.role;$('code').value=room;history.replaceState(null,'','?room='+room);message('방 '+room+' · '+(role==='farmer'?'당신은 남자 🏃':'당신은 닭 🐔')+' · 상대방 대기 중');$('action').disabled=role!=='farmer'}if(m.type==='role'){role=m.role;$('action').disabled=role!=='farmer'}if(m.type==='state'){phase=m.phase;$('info').textContent='판 '+m.round+' · '+(phase==='waiting'?'친구 대기':phase==='playing'?'게임 중':'포획 성공!');m.players.forEach(p=>{let el=$(p.role==='farmer'?'farmer':'chicken');el.style.left=p.x+'%';el.style.top=p.y+'%'});$('next').style.display=phase==='finished'?'inline-block':'none';if(phase==='playing')message(role==='farmer'?'🏃 닭을 따라가서 포획하세요.':'🐔 남자를 피해 도망가세요.');if(phase==='finished')message(role==='farmer'?'🎉 닭 포획 성공!':'🐔 잡혔습니다! 다음 판에 역할을 바꿔요.')}if(m.type==='caught')sound();if(m.type==='notice'||m.type==='error')message(m.message)};ws.onclose=()=>{phase='waiting';message('연결이 끊겼습니다. 다시 입장하세요.')}}
$('create').onclick=()=>connect(Math.random().toString(36).slice(2,8).toUpperCase());$('join').onclick=()=>connect($('code').value.trim().toUpperCase());$('share').onclick=async()=>{unlock();if(!room){message('먼저 방을 만들어 주세요.');return}const url=location.origin+'/?room='+room;try{if(navigator.share)await navigator.share({title:'닭 잡아라! 2인 대결',text:'닭 역할로 들어와서 같이 하자!',url});else{await navigator.clipboard.writeText(url);message('초대 링크 복사 완료')}}catch{message('초대 주소: '+url)}};$('action').onclick=()=>{unlock();if(ws?.readyState===1&&role==='farmer')ws.send(JSON.stringify({type:'catch'}))};$('next').onclick=()=>ws?.send(JSON.stringify({type:'next'}));
const pad=$('pad'),knob=$('knob');function steer(e){let r=pad.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/42,y=(e.clientY-r.top-r.height/2)/42,l=Math.max(1,Math.hypot(x,y));dir={x:x/l,y:y/l};knob.style.transform='translate('+dir.x*35+'px,'+dir.y*35+'px)'}pad.onpointerdown=e=>{unlock();pad.setPointerCapture(e.pointerId);steer(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))steer(e)};function stop(){dir={x:0,y:0};knob.style.transform='translate(0,0)'}pad.onpointerup=stop;pad.onpointercancel=stop;
setInterval(()=>{if(phase==='playing'&&ws?.readyState===1)ws.send(JSON.stringify({type:'move',dx:dir.x,dy:dir.y}))},50);const invite=new URLSearchParams(location.search).get('room');if(invite){$('code').value=invite;connect(invite)}
</script></body></html>
