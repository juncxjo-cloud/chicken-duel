<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>닭 잡아라! 2인 대결</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#243322;font-family:system-ui,sans-serif}main{max-width:520px;margin:auto;padding:12px}h2{font-size:22px}.panel{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #9aa99b}button{background:#25774b;color:white;font-weight:700;touch-action:none}input{width:105px;text-transform:uppercase}#board{position:relative;height:min(60vh,450px);min-height:300px;background:repeating-linear-gradient(45deg,#9ac879 0 38px,#a7d489 38px 76px);border:5px solid #678e54;border-radius:14px;overflow:hidden;touch-action:none}.person{position:absolute;font-size:54px;transform:translate(-50%,-50%);line-height:1;filter:drop-shadow(1px 3px 2px #0004)}#hint{font-weight:700;min-height:44px;margin:8px 0}#controls{display:flex;align-items:center;justify-content:space-between;gap:12px}#pad{width:146px;height:146px;border-radius:50%;background:#d8e6d4;position:relative;touch-action:none;border:3px solid #8cae87}#knob{width:62px;height:62px;border-radius:50%;background:#4e9a71;position:absolute;left:39px;top:39px}#action{width:105px;height:105px;border-radius:50%;background:#edaa3d;color:#332006;border:3px solid #d38e22}#action:disabled{opacity:.45}#next{display:none}small{color:#647568}
/* iPhone Safari/Chrome: keep game controls above browser chrome */
html{height:100%;overflow:hidden}body{height:100%;overflow:hidden}main{height:100vh;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:8px 12px max(12px,env(safe-area-inset-bottom));gap:4px}h2{font-size:clamp(17px,4.5vw,22px);margin:2px 0;flex-shrink:0}.panel{margin:2px 0;gap:5px;flex-shrink:0}.panel button,.panel input{padding:8px 10px;font-size:14px}#hint{min-height:0;margin:2px 0;font-size:13px;line-height:1.25;flex-shrink:0}#info{font-size:13px}#board{flex:1 1 auto;height:auto;min-height:100px;max-height:none}#controls{flex:0 0 auto;min-height:108px;padding:4px 2px;touch-action:none}#pad{width:104px;height:104px;flex-shrink:0}#knob{width:46px;height:46px;left:50%;top:50%;margin-left:-23px;margin-top:-23px;pointer-events:none}#action{width:92px;height:92px;flex-shrink:0;font-size:15px}small{font-size:11px;line-height:1.2;flex-shrink:0}@media(max-height:650px){main{gap:2px;padding-top:4px}#controls{min-height:86px}#pad{width:84px;height:84px}#knob{width:38px;height:38px;margin-left:-19px;margin-top:-19px}#action{width:78px;height:78px}#board{border-width:3px}.person{font-size:42px}small{font-size:10px}}
</style></head><body><main><h2>🐔 닭 잡아라! · 2인 대결</h2><div class="panel"><button id="solo">혼자 연습</button><button id="create">방 만들기</button><input id="code" maxlength="6" placeholder="방 코드"><button id="join">입장</button><button id="share">초대 공유</button></div><div id="hint">방을 만들고 친구에게 초대 링크를 보내세요.</div><div class="panel"><span id="info">대기 중</span><button id="next">🔄 역할 바꾸고 다음 판</button></div><div id="board"><div style="position:absolute;left:7%;top:7%;font-size:35px">🌳</div><div style="position:absolute;right:6%;top:10%;font-size:35px">🌻</div><div id="farmer" class="person" style="left:18%;top:55%">🏃</div><div id="chicken" class="person" style="left:80%;top:45%">🐔</div></div><div id="controls"><div id="pad"><div id="knob"></div></div><button id="action">🥅<br>포획!</button></div><small>왼쪽 원을 움직여 이동하세요. 닭 역할은 도망갑니다. 시간제한은 없습니다. 포획 성공 시 꼬꼬댁 소리가 납니다.</small></main><script>
const $=id=>document.getElementById(id);let ws,role='',room='',phase='waiting',dir={x:0,y:0},audio,solo=false,soloFarmer={x:18,y:55},soloChicken={x:80,y:45},soloLast=performance.now();
function unlock(){try{const A=window.AudioContext||window.webkitAudioContext;audio=audio||new A();audio.resume()}catch{}}
function sound(){try{unlock();let t=audio.currentTime;[650,510,740,490].forEach((f,i)=>{let o=audio.createOscillator(),v=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t+i*.15);o.frequency.exponentialRampToValueAtTime(f*.7,t+i*.15+.12);v.gain.setValueAtTime(.0001,t+i*.15);v.gain.exponentialRampToValueAtTime(.12,t+i*.15+.02);v.gain.exponentialRampToValueAtTime(.0001,t+i*.15+.13);o.connect(v);v.connect(audio.destination);o.start(t+i*.15);o.stop(t+i*.15+.14)})}catch{}}
function message(s){$('hint').textContent=s}
function connect(code){solo=false;unlock();if(ws){ws.onclose=null;ws.close()}ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'join',code}));ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='joined'){room=m.code;role=m.role;$('code').value=room;history.replaceState(null,'','?room='+room);message('방 '+room+' · '+(role==='farmer'?'당신은 남자 🏃':'당신은 닭 🐔')+' · 상대방 대기 중');$('action').disabled=role!=='farmer'}if(m.type==='role'){role=m.role;$('action').disabled=role!=='farmer'}if(m.type==='state'){phase=m.phase;$('info').textContent='판 '+m.round+' · '+(phase==='waiting'?'친구 대기':phase==='playing'?'게임 중':'포획 성공!');m.players.forEach(p=>{let el=$(p.role==='farmer'?'farmer':'chicken');el.style.left=p.x+'%';el.style.top=p.y+'%'});$('next').style.display=phase==='finished'?'inline-block':'none';if(phase==='playing')message(role==='farmer'?'🏃 닭을 따라가서 포획하세요.':'🐔 남자를 피해 도망가세요.');if(phase==='finished')message(role==='farmer'?'🎉 닭 포획 성공!':'🐔 잡혔습니다! 다음 판에 역할을 바꿔요.')}if(m.type==='caught')sound();if(m.type==='notice'||m.type==='error')message(m.message)};ws.onclose=()=>{phase='waiting';message('연결이 끊겼습니다. 다시 입장하세요.')}}
$('solo').onclick=()=>{if(ws){ws.onclose=null;ws.close();ws=null}solo=true;room='';role='farmer';phase='playing';soloFarmer={x:18,y:55};soloChicken={x:80,y:45};soloLast=performance.now();$('info').textContent='혼자 연습 · 게임 중';$('action').disabled=false;$('next').style.display='none';message('🏃 조이스틱으로 이동하여 도망가는 닭을 잡으세요!')};$('create').onclick=()=>connect(Math.random().toString(36).slice(2,8).toUpperCase());$('join').onclick=()=>connect($('code').value.trim().toUpperCase());$('share').onclick=async()=>{unlock();if(!room){message('먼저 방을 만들어 주세요.');return}const url=location.origin+'/?room='+room;try{if(navigator.share)await navigator.share({title:'닭 잡아라! 2인 대결',text:'닭 역할로 들어와서 같이 하자!',url});else{await navigator.clipboard.writeText(url);message('초대 링크 복사 완료')}}catch{message('초대 주소: '+url)}};$('action').onclick=()=>{unlock();if(solo&&phase==='playing'){if(Math.hypot(soloFarmer.x-soloChicken.x,soloFarmer.y-soloChicken.y)<19){phase='finished';$('info').textContent='혼자 연습 · 포획 성공!';message('🎉 성공! 혼자 연습을 눌러 다시 시작하세요.');sound()}else message('닭에게 더 가까이 접근하세요!')}else if(ws?.readyState===1&&role==='farmer')ws.send(JSON.stringify({type:'catch'}))};$('next').onclick=()=>ws?.send(JSON.stringify({type:'next'}));
const pad=$('pad'),knob=$('knob');let activePointer=null;
function steerAt(x,y){const r=pad.getBoundingClientRect(),radius=Math.max(1,r.width/2),dx=(x-r.left-radius)/(radius*.75),dy=(y-r.top-radius)/(radius*.75),length=Math.max(1,Math.hypot(dx,dy));dir={x:dx/length,y:dy/length};const travel=(r.width-knob.offsetWidth)/2;knob.style.transform='translate('+dir.x*travel+'px,'+dir.y*travel+'px)'}
function stop(){activePointer=null;dir={x:0,y:0};knob.style.transform='translate(0,0)'}
pad.addEventListener('pointerdown',e=>{e.preventDefault();unlock();activePointer=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch{}steerAt(e.clientX,e.clientY)});
pad.addEventListener('pointermove',e=>{if(activePointer===e.pointerId){e.preventDefault();steerAt(e.clientX,e.clientY)}});
pad.addEventListener('pointerup',e=>{if(activePointer===e.pointerId)stop()});
pad.addEventListener('pointercancel',e=>{if(activePointer===e.pointerId)stop()});
pad.addEventListener('lostpointercapture',stop);

setInterval(()=>{if(solo&&phase==='playing'){let now=performance.now(),dt=Math.min(.08,(now-soloLast)/1000);soloLast=now;soloFarmer.x=Math.max(5,Math.min(95,soloFarmer.x+dir.x*31*dt));soloFarmer.y=Math.max(8,Math.min(92,soloFarmer.y+dir.y*31*dt));let dx=soloChicken.x-soloFarmer.x,dy=soloChicken.y-soloFarmer.y,d=Math.hypot(dx,dy)||1;if(d<48){soloChicken.x=Math.max(5,Math.min(95,soloChicken.x+dx/d*19*dt));soloChicken.y=Math.max(8,Math.min(92,soloChicken.y+dy/d*19*dt))}$('farmer').style.left=soloFarmer.x+'%';$('farmer').style.top=soloFarmer.y+'%';$('chicken').style.left=soloChicken.x+'%';$('chicken').style.top=soloChicken.y+'%'}if(phase==='playing'&&ws?.readyState===1)ws.send(JSON.stringify({type:'move',dx:dir.x,dy:dir.y}))},50);const invite=new URLSearchParams(location.search).get('room');if(invite){$('code').value=invite;connect(invite)}
</script></body></html>
